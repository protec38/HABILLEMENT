<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Protection Civile - Habillement</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />

  <!-- Leaflet (si tu affiches une carte quelque part) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body>
  <!-- TOPBAR -->
  <header class="topbar">
    <div class="wrap">
      <div class="brand">
        <span class="brand-mark"><img src="{{ url_for('static', filename='logo_pc.png') }}" alt="" class="logo" /></span>
        <span class="brand-copy"><strong>Habillement</strong><small>Protection Civile</small></span>
      </div>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>

  <main class="wrap">
    <!-- Écran de connexion (masqué automatiquement sur /a/<id>) -->
    <section id="loginView" class="card center floating">
      <h1>Connexion</h1>
      <p class="muted">Protection Civile – Gestion des tenues et prêts</p>
      <div class="grid-3">
        <input id="loginEmail" class="input" placeholder="Email" />
        <input id="loginPass" class="input" type="password" placeholder="Mot de passe" />
        <button id="loginBtn" class="btn btn-primary" onclick="App.login()">Se connecter</button>
      </div>
      <div id="loginError" class="alert hidden mt"></div>
      <p class="mt">Lien prêt public (filtré par antenne) : <span class="badge">/a/&lt;antenna_id&gt;</span></p>
    </section>

    <!-- VUES (injectées par app.js) -->
    <section id="dashboard" class="screen hidden"></section>
    <section id="antennes" class="screen hidden"></section>
    <section id="stock" class="screen hidden"></section>
    <section id="benevoles" class="screen hidden"></section>
    <section id="prets" class="screen hidden"></section>
    <section id="inventaire" class="screen hidden"></section>
    <section id="analytics" class="screen hidden"></section>
    <section id="admin" class="screen hidden"></section>
    <section id="pretPublic" class="screen hidden"></section>

    <!-- MODAL (overlay + carte opaques) -->
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-card">
        <div class="modal-header">
          <div id="modalTitle"></div>
          <button class="btn btn-icon btn-ghost" onclick="App.closeModal()" aria-label="Fermer">×</button>
        </div>
        <div id="modalBody"></div>
      </div>
    </div>

    <!-- Zone des toasts -->
    <div id="flash"></div>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
