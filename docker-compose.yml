version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pc_habillement}
      POSTGRES_USER: ${POSTGRES_USER:-pc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pc_pass}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pc_user} -d ${POSTGRES_DB:-pc_habillement}"]
      interval: 50s
      timeout: 50s
      retries: 30

  web:
    build: ./web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://pc_user:pc_pass@db:5432/pc_habillement}
      SECRET_KEY: ${SECRET_KEY:-change-me-very-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pc.fr}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      LDAP_ENABLED: ${LDAP_ENABLED:-true}
      LDAP_URL: ${LDAP_URL:-ldap://lldap:3890}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-uid=admin,ou=people,dc=apc38,dc=local}
      LDAP_USER_BASE_DN: ${LDAP_USER_BASE_DN:-ou=people,dc=apc38,dc=local}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-(|(uid={username})(mail={username}))}
      LDAP_GROUP_BASE_DN: ${LDAP_GROUP_BASE_DN:-ou=groups,dc=apc38,dc=local}
      LDAP_GROUP_FILTER: ${LDAP_GROUP_FILTER:-(member={user_dn})}
      LDAP_GROUP_NAME_ATTR: ${LDAP_GROUP_NAME_ATTR:-cn}
      LDAP_GROUP_REQUIRED: ${LDAP_GROUP_REQUIRED:-habillement}
      LDAP_GROUP_ROLE_MAP: ${LDAP_GROUP_ROLE_MAP:-habillement:admin}
    ports:
      - "8010:8000"
    volumes:
      - ./web:/app
    networks:
      - default
      - lldap_ldap_net

volumes:
  dbdata:

networks:
  lldap_ldap_net:
    external: true
